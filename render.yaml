databases:
  - name: case-law-db
    plan: free
    postgresMajorVersion: "15"

services:
  - name: case-law-search-api
    type: web
    runtime: docker
    dockerfilePath: ./docker/Dockerfile
    dockerContext: .
    plan: free
    # /health is a plain {"status": "ok"} route (app/main.py) -- lighter than
    # hitting /docs, which renders the full Swagger UI HTML on every check.
    healthCheckPath: /health
    # -w 1: Render's free instance is 512MB RAM / 0.1 CPU (confirmed against
    # Render's own community docs). The embedding model (~90MB on disk, more
    # once loaded as PyTorch tensors) is loaded once per worker process --
    # 4 workers each loading their own copy doesn't fit in 512MB. A single
    # worker serializes requests, which is the right tradeoff for a low-
    # traffic demo over risking an OOM kill.
    # --timeout 120: on 0.1 CPU, loading the model on a cold worker measured
    # well past gunicorn's 30s default, which killed the request outright
    # (observed as a 502 after Render's proxy gave up). The Dockerfile now
    # bakes the model into the image so this is disk-load time, not a
    # network download, but 0.1 CPU is still slow enough to need the margin.
    dockerCommand: gunicorn -w 1 --timeout 120 -k uvicorn.workers.UvicornWorker app.main:app --bind 0.0.0.0:8000
    # No preDeployCommand: Render restricts it to paid web services, private
    # services, and background workers -- free web services aren't eligible
    # (confirmed against Render's docs), so it can't run migrations here.
    # Migrations are run manually, once, after the first deploy -- see the
    # "Manual Migrations" section in README.md. Do NOT replace this with an
    # @app.on_event("startup") hook, even with a single worker: it ties
    # migration success to every container start/restart instead of one
    # controlled, observable step, and reintroduces the multi-worker race
    # the moment worker count ever goes back up.
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: case-law-db
          property: connectionString
      - key: EMBEDDING_MODEL
        value: all-MiniLM-L6-v2
      - key: CORS_ORIGINS
        # Set to your deployed Vercel URL (e.g. https://your-app.vercel.app)
        # in the Render dashboard once the frontend is deployed -- left
        # unset here since no committed value should assume a specific
        # frontend URL.
        sync: false
