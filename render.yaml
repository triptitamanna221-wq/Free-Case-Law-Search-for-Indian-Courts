# No `databases:` block on purpose. Postgres lives on Neon's free tier, not
# Render's: Render's free database is deleted 30 days after creation on a
# fixed clock (not idle-based, so nothing you can do keeps it alive), which
# is a poor foundation for a link someone opens weeks after it's shared.
# Neon's free tier doesn't expire and resumes from scale-to-zero on its own.
# DATABASE_URL is therefore set by hand in the Render dashboard -- see the
# envVars note below.

services:
  - name: case-law-search-api
    type: web
    runtime: docker
    dockerfilePath: ./docker/Dockerfile
    dockerContext: .
    plan: free
    # /health is a plain {"status": "ok"} route (app/main.py) -- lighter than
    # hitting /docs, which renders the full Swagger UI HTML on every check.
    healthCheckPath: /health
    # -w 1: Render's free instance is 512MB RAM / 0.1 CPU (confirmed against
    # Render's own community docs). The embedding model is loaded once per
    # worker process, so worker count multiplies the largest cost in the
    # container. Measured peak for the onnx serving path is ~290MB for one
    # worker; a second would not fit. A single worker serializes requests,
    # which is the right tradeoff for a low-traffic demo.
    # --timeout 120: safety margin for slow requests on 0.1 CPU -- one tenth
    # of a core makes even modest work take multiples of what it does on a
    # dev machine.
    #
    # History worth not repeating: this ran out of memory, not out of time.
    # The original torch-based serving path peaked at ~350MB in one worker
    # (~315MB of that just `import torch`, before any weights load), which
    # against the 512MB container cap meant the kernel OOM-killed the whole
    # container the moment /search triggered that import -- no traceback, no
    # gunicorn WORKER TIMEOUT, just a fresh container with gunicorn back at
    # pid 1. Neither -w 1 nor --timeout fixed it, and eagerly loading at
    # startup only moved the OOM into boot, crash-looping so even /health
    # never answered. The fix was making the serving path smaller:
    # app/ingestion/onnx_embedder.py runs the same weights via onnxruntime.
    dockerCommand: gunicorn -w 1 --timeout 120 -k uvicorn.workers.UvicornWorker app.main:app --bind 0.0.0.0:8000
    # No preDeployCommand: Render restricts it to paid web services, private
    # services, and background workers -- free web services aren't eligible
    # (confirmed against Render's docs), so it can't run migrations here.
    # Migrations are run manually, once, after the first deploy -- see the
    # "Manual Migrations" section in README.md. Do NOT replace this with an
    # @app.on_event("startup") hook, even with a single worker: it ties
    # migration success to every container start/restart instead of one
    # controlled, observable step, and reintroduces the multi-worker race
    # the moment worker count ever goes back up.
    envVars:
      - key: DATABASE_URL
        # sync: false means "managed in the dashboard, don't touch it". This
        # matters: an earlier version wired this `fromDatabase` to a Render
        # Postgres, and leaving that in place would let any blueprint re-sync
        # silently point production back at the expiring database this setup
        # deliberately moved off. Set it to the Neon connection string
        # (app/config.py normalizes the postgres:// scheme and preserves the
        # ?sslmode=require Neon requires).
        sync: false
      - key: EMBEDDING_MODEL
        value: all-MiniLM-L6-v2
      - key: CORS_ORIGINS
        # Set to your deployed Vercel URL (e.g. https://your-app.vercel.app)
        # in the Render dashboard once the frontend is deployed -- left
        # unset here since no committed value should assume a specific
        # frontend URL.
        sync: false
