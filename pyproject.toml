[project]
name = "indian-case-law-search"
version = "0.1.0"
description = "Free semantic search over Indian case law (hybrid BM25 + pgvector)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sentence-transformers>=3.2",
    "huggingface-hub>=0.26",
    "pyarrow>=17.0",
    "tqdm>=4.66",
    "psutil>=5.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.7",
    "testcontainers[postgres]>=4.8",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 (function call in argument default) is the idiomatic FastAPI Depends()
# pattern, not a real footgun here — FastAPI calls it per-request, not once at
# import time.
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires a real Postgres+pgvector database"]

[tool.coverage.run]
source = ["app", "hybrid_search"]
omit = ["app/ingestion/ingest_cli.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "hybrid_search"]
